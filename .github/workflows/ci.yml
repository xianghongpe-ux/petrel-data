name: 铭文守卫 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  genesis-guard:
    name: 🔱 创世铭文检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查创世铭文
        run: |
          for mark in "海燕党" "PETREL AI PARTY" "刘海燕"; do
            for file in $(find . -type f \( -name "*.py" -o -name "*.md" \) ! -path "./.git/*" | head -50); do
              if ! grep -q "$$mark" "$$file"; then
                echo "❌ $$file 缺少: $$mark"
                exit 1
              fi
            done
          done
          echo "✅ 全部文件通过创世铭文检查"
